const cT=new THREE.Vector3(),cPos=new THREE.Vector3();
function updateCamera(dt){
 const tp=GSTATE==='menu'?1:0;const D=[7,10,15][SET.camDist]*(P.fly?1.35:1)*(P.inside?1.2:1);
 const want=GSTATE==='menu'?(innerWidth<760?9.5:6.6):D;CAMS.dist=CAMS.dist===0?want:CAMS.dist+(want-CAMS.dist)*Math.min(1,dt*4);
 let yaw=CAMS.yaw,pitch=CAMS.pitch;
 if(GSTATE==='menu'){CAMS.orb+=dt*.18;yaw=P.h+Math.PI+Math.sin(CAMS.orb)*.8;pitch=.2}
 const ty=P.y+(P.mode==='lie'?.9:1.35)+(GSTATE==='menu'?.15:0);cT.set(P.x,ty,P.z);
 const cp=Math.cos(pitch),sp=Math.sin(pitch);let d=CAMS.dist;
 const dxv=-Math.sin(yaw)*cp,dyv=sp,dzv=-Math.cos(yaw)*cp;
 // keep the camera out of buildings (slab test against collider boxes) and inside rooms
 if(!P.inside||true){const cols=colsAt(P.x,P.z);for(const c of cols){const top=c.h;if(top<P.y+2)continue;
   let t0=0,t1=d;const ax=[[dxv,cT.x,c.x-c.hw-.3,c.x+c.hw+.3],[dzv,cT.z,c.z-c.hd-.3,c.z+c.hd+.3],[dyv,cT.y,-1,top+.3]];let hit=true;
   for(const[dv,o,lo,hi2]of ax){if(Math.abs(dv)<1e-6){if(o<lo||o>hi2){hit=false;break}}else{let a=(lo-o)/dv,b=(hi2-o)/dv;if(a>b){const q=a;a=b;b=q}t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1){hit=false;break}}}
   if(hit&&t0>0.3&&t0<d)d=Math.max(1.6,t0-.2)}}
 cPos.set(cT.x+dxv*d,cT.y+dyv*d,cT.z+dzv*d);
 if(P.inside){const I=P.inside;if(cPos.x<I.x0+.8||cPos.x>I.x1-.8||cPos.z<I.z0+.8||cPos.z>I.z1-.8)cPos.y=Math.max(cPos.y,5);cPos.y=Math.min(I.h+14,cPos.y)}
 cPos.y=Math.max(cPos.y,.7);
 cam.position.copy(cPos);cam.lookAt(cT)}

// ---- joystick
let stickId=null;const SW=$('stickWrap'),KN=$('knob');
function stickMove(e){const r=SW.getBoundingClientRect(),R=r.width/2,dx=e.clientX-(r.left+R),dz=e.clientY-(r.top+R),m=Math.hypot(dx,dz),k=m>R?R/m:1,ux=dx*k,uz=dz*k;
 KN.style.transform='translate('+ux*.78+'px,'+uz*.78+'px)';IN.mx=ux/R;IN.mz=-uz/R}

const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;IN.mx=IN.mz=0;KN.style.transform=''};
SW.addEventListener('pointerup',stickEnd);SW.addEventListener('pointercancel',stickEnd);
// ---- buttons

hold('bJump',()=>{IN.jump=true;IN.jumpEdge=true},()=>{IN.jump=false});
hold('bUp',()=>{IN.up=true},()=>{IN.up=false});hold('bDown',()=>{IN.down=true},()=>{IN.down=false});
$('bRun').addEventListener('pointerdown',e=>{IN.runT=!IN.runT;$('bRun').classList.toggle('on',IN.runT);e.preventDefault()});
$('bAct').addEventListener('pointerdown',e=>{doAct();e.preventDefault()});
$('bMenu').onclick=()=>openMenu(true);
function toggleFly(){if(P.inside){toast('No flying indoors');return}P.fly=!P.fly;if(P.fly){P.skate=false;P.sit=P.lie=false;P.vy=5;P.y+=1;sfx('star');toast('Jetpack on · ▲ up  ▼ down')}else toast('Jetpack off')}
function toggleSkate(){P.skate=!P.skate;if(P.skate){P.fly=false;P.sit=P.lie=false;toast('Skateboard')}}
function toggleSit(){if(P.sit){P.sit=false;return}if(P.air||P.swim||P.fly){toast('Land first');return}P.sit=true;P.lie=false;P.skate=false;P.vx=P.vz=0}
function toggleSleep(){if(P.lie){P.lie=false;return}P.lie=true;P.sit=false;P.skate=false;P.vx=P.vz=0;sfx('door');toast('Sweet dreams…')}
const SMALL=[['sSkate','🛹','Skate',toggleSkate,()=>P.skate],['sFly','🚀','Fly',toggleFly,()=>P.fly],['sSit','🪑','Sit',toggleSit,()=>P.sit],['sWave','👋','Wave',()=>{P.wave=2.4;RB.applyEmotion('joy',.9,'')},()=>P.wave>0],['sSleep','🛏','Sleep',toggleSleep,()=>P.lie]];
SMALL.forEach(([id,ic,nm,fn])=>{const b=el('button','ab sm',ic+'<span>'+nm+'</span>');b.id=id;b.addEventListener('pointerdown',e=>{fn();closeMore();e.preventDefault()});$('row2').append(b)});

// ---- mood tray
RB.EMO_NAMES.forEach(n=>{const b=el('button','','<i style="--c:rgb('+RB.EMO[n].c.join(',')+')"></i>'+n);b.onclick=()=>{SET.mood=n;saveSet();RB.applyEmotion(n,.9,'');$('moodTray').classList.add('hide')};$('moodTray').append(b)});
// ---- camera drag / zoom
let dragId=null,dx0=0,dy0=0;
cv.addEventListener('pointerdown',e=>{if(GSTATE!=='play')return;dragId=e.pointerId;dx0=e.clientX;dy0=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==dragId)return;CAMS.yaw-=(e.clientX-dx0)*.0055*SET.camSens;CAMS.pitch=Math.max(-.15,Math.min(1.3,CAMS.pitch+(e.clientY-dy0)*.0045*SET.camSens*(SET.invY?-1:1)));dx0=e.clientX;dy0=e.clientY});
const dEnd=e=>{if(e.pointerId===dragId)dragId=null};cv.addEventListener('pointerup',dEnd);cv.addEventListener('pointercancel',dEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();if(GSTATE==='play')SET.camDist=Math.max(0,Math.min(2,SET.camDist+(e.deltaY>0?.35:-.35)));},{passive:false});
// ---- keyboard
const KEYS={};
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();KEYS[k]=1;
 if(k==='escape'){if(GSTATE==='play')openMenu(true);else if(GSTATE==='pause')startPlay();return}
 if(GSTATE!=='play')return;
 if(k===' '){IN.jump=true;IN.jumpEdge=true;e.preventDefault()}else if(k==='e')doAct();else if(k==='f')toggleFly();else if(k==='k')toggleSkate();else if(k==='x')toggleSit();else if(k==='b'){P.wave=2.4}else if(k==='m')$('moodTray').classList.toggle('hide');
 if(k==='shift')IN.run=true;if(k==='c')IN.down=true;});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();KEYS[k]=0;if(k===' ')IN.jump=false;if(k==='shift')IN.run=false;if(k==='c')IN.down=false});
function keyMove(){if(stickId!==null)return;const f=(KEYS.w||KEYS.arrowup?1:0)-(KEYS.s||KEYS.arrowdown?1:0),r=(KEYS.d||KEYS.arrowright?1:0)-(KEYS.a||KEYS.arrowleft?1:0);const m=Math.hypot(f,r)||1;IN.mx=r/m*(f||r?.9:0);IN.mz=f/m*(f||r?.9:0)}

// ---- minimap
const MC=$('map'),mx=MC.getContext('2d'),ZC=['#c9ccd6','#eab6c8','#a9d98b','#f2e3bd'];
function drawMap(){if(!SET.map||GSTATE!=='play'||P.inside)return;const W=MC.width,c=W/2,k=W/2/(S*3.1),y=CAMS.yaw,cs=Math.cos(y),sn=Math.sin(y);
 mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,W,W);mx.save();mx.beginPath();mx.arc(c,c,c-3,0,6.2832);mx.clip();mx.fillStyle='#8aa0b4';mx.fillRect(0,0,W,W);
 mx.setTransform(-k*cs,-k*sn,k*sn,-k*cs,c+k*(cs*P.x-sn*P.z),c+k*(sn*P.x+cs*P.z));
 const ci=Math.round(P.x/S),cj=Math.round(P.z/S);
 for(let i=ci-4;i<=ci+4;i++)for(let j=cj-4;j<=cj+4;j++){const riv=RIV(j),lm=!riv&&zoneOf(i,j)==3&&hash(i+1000,j+1000,41)%60<5;
  mx.fillStyle='#454b5a';mx.fillRect(i*S-24,j*S-24,S,S);mx.fillStyle=riv?'#4aa3d0':lm?'#f5c86a':ZC[zoneOf(i,j)];mx.fillRect(i*S-18,j*S-18,36,36);
  if(riv){mx.fillStyle='#d8d2c4';mx.fillRect(i*S-18,j*S-18,36,3);mx.fillRect(i*S-18,j*S+15,36,3)}}
 mx.restore();mx.setTransform(1,0,0,1,0,0);mx.translate(c,c);mx.rotate(y-P.h);mx.fillStyle='#ff4d6d';mx.strokeStyle='#fff';mx.lineWidth=4;mx.beginPath();mx.moveTo(0,-16);mx.lineTo(11,12);mx.lineTo(0,6);mx.lineTo(-11,12);mx.closePath();mx.fill();mx.stroke();mx.setTransform(1,0,0,1,0,0)}
// ---- HUD state
function updateHud(dt){const ctx=P.ctx,inn=!!P.inside,house=inn&&(P.inside.kind==='house'||P.inside.kind==='apt');
 const showAct=!!ctx||P.sit||P.lie;$('bAct').classList.toggle('hide',!showAct);$('bAct').textContent=ctx?'🚪':'🧍';
 const pr=$('prompt');if(ctx){pr.classList.remove('hide');pr.textContent=ctx.t==='exit'?'🚪 Exit (E)':'🚪 Enter '+(KINDN[ctx.c.kind]||'building')+' (E)'}else if(P.sit||P.lie){pr.classList.remove('hide');pr.textContent='Move to stand up'}else pr.classList.add('hide');
 $('bUp').classList.toggle('hide',!P.fly);$('bDown').classList.toggle('hide',!P.fly);$('bJump').classList.toggle('hide',P.fly);$('bRun').classList.toggle('hide',P.fly);
 $('sSleep').classList.toggle('hide',!house);$('sFly').classList.toggle('hide',inn);
 SMALL.forEach(([id,,,,on])=>$(id).classList.toggle('on',!!on()));
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on')}}
// ---- applying settings
function applyAll(){RB.setVariant(SET.variant);RB.setShoes(SET.shoes);RB.setAccent(SET.accent?parseInt(SET.accent.slice(1),16):null);RB.applyEmotion(SET.mood,.85,'');
 TRAF.n=SET.trafN;TRAF.spd=SET.trafSpd;TRAF.yld=SET.trafYld;TRAF.honk=SET.trafHonk;TRAF.on=SET.tOn;applyTraffic();
 tmode=SET.time;if(TP[tmode]!=null)phase=TP[tmode];WX=SET.weather;if(SEASON!==SET.season){SEASON=SET.season;applySeason()}
 qSel=2;setQ(1)}
// ---- main loop
let last=performance.now(),T=0,fx=0,fc=0;const pv={x:0,z:0,tx:0,tz:1},dummyP={};
function frame(now){requestAnimationFrame(frame);if(QT[qi].cap&&now-lastR<15)return;lastR=now;const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 fa+=(dt-fa)*.04;if(qSel==0&&T>8&&T-lastDrop>5&&fa>.04&&qi>0){setQ(qi-1);lastDrop=T}
 paused=GSTATE==='pause';
 if(GSTATE==='play'){if(TR.on)stepTrans(dt);else{keyMove();stepPlayer(dt)}}else{P.vx=P.vz=0;P.spd=0;P.mode='walk'}
 const cx=P.inside?P.ret.x:P.x,cz=P.inside?P.ret.z:P.z,h=CAMS.yaw;pv.x=cx;pv.z=cz;pv.tx=Math.sin(h);pv.tz=Math.cos(h);
 if(tmode==0&&!paused)phase=(phase+dt/150)%1;
 const cI=Math.round(cx/S),cJ=Math.round(cz/S);updateCells(cI,cJ,fx<3?80:QT[qi].burst);if(fx<3)fx++;if(QT[qi].hi)upgrade(cI,cJ);
 // traffic
 const outside=!P.inside&&GSTATE==='play'&&P.y<3.2;
 for(const c of cars){if(!c.m.visible)continue;const ax=c.ax,al=ax?cx:cz,ac=ax?cz:cx;
  if(c.line===undefined||Math.abs(c.s-al)>R*S||Math.abs((c.line+.5)*S-ac)>R*S){place(c,cx,cz);c.s=al+(Math.random()<.5?-1:1)*R*S*.95;c.v=1}
  const lane=ax?3*c.dir:-3*c.dir,rd=(c.line+.5)*S+lane,qx=ax?c.s:rd,qz=ax?rd:c.s;let want=1;
  if(c.v===undefined)c.v=1;
  if(outside){const dl=ax?(P.x-qx)*c.dir:(P.z-qz)*c.dir,lt=ax?P.z-qz:P.x-qx;
   if(TRAF.yld&&dl>0&&dl<11&&Math.abs(lt)<3.6){want=0;if(TRAF.honk&&c.v>.5&&dl<7&&T-(c.hk||-9)>3){c.hk=T;sfx('honk')}}
   if(Math.abs(dl)<2.8&&Math.abs(lt)<1.6&&c.v>.3&&P.hurt<=0){P.hurt=1.2;P.vx=(ax?c.dir:0)*13+(ax?0:lt*3);P.vz=(ax?0:c.dir)*13+(ax?lt*3:0);P.vy=8;P.air=true;sfx('hit');buzz(90);RB.applyEmotion('surprise',.95,'');toast('Watch out for traffic!')}}
  c.v+=(want-c.v)*Math.min(1,dt*(want?1.4:4));
  if(!paused)c.s+=c.dir*c.sp*TRAF.spd*c.v*dt;
  c.m.position.set(ax?c.s:rd,GSTATE!=='play'&&Math.hypot(qx-P.x,qz-P.z)<20?-60:.1,ax?rd:c.s);c.m.rotation.y=ax?(c.dir>0?Math.PI/2:-Math.PI/2):(c.dir>0?0:Math.PI)}
 for(const g of clouds){const dx=mod(g.userData.ox+T*3-cx,480)-240,dz=mod(g.userData.oz-cz,480)-240;g.position.x=cx+dx;g.position.z=cz+dz;const f=Math.min(1,Math.max(0,(Math.hypot(dx,dz)-150)/80));g.material.color.copy(cloudBase);g.material.opacity=1-f}
 updateSky(dt,pv,h);updateAir(dt,pv);
 {const wt=WXT[WX],k=Math.min(1,dt*.6),st=dt/4;WC.g+=(wt.g-WC.g)*k;WC.h+=(wt.h-WC.h)*k;WC.s+=(wt.s-WC.s)*k;WC.fn+=(wt.fn-WC.fn)*k;WC.ff+=(wt.ff-WC.ff)*k;WC.rn=appr(WC.rn,wt.rain?(wt.rain>1?1:.7):0,st);WC.sn=appr(WC.sn,wt.snow?1:0,st)}
 // robot
 RB.root.position.set(P.x,P.y,P.z);
 const wantYaw=P.h+(P.mode==='skate'?-Math.PI/2:0)+(P.mode==='lie'?0:0);P.vh=angLerp(P.vh,wantYaw,1-Math.exp(-dt*(P.mode==='lie'||P.mode==='sit'?3:14)));RB.root.rotation.y=P.vh;
 RB.update(dt,{v:(P.spd||0)/SC*(P.mode==='fly'?.25:1),lean:P.mode==='walk'&&P.spd>4.5?.22:0,mode:P.mode,wave:P.wave>0?1:0});
 RB.shadows(true);
 if(P.inside){const I=P.inside;scene.background.set(I.bg);scene.fog.near=400;scene.fog.far=800;scene.fog.color.set(I.bg);hemi.color.set(0xffffff);hemi.groundColor.set(0x998f88);hemi.intensity=.5;sun.visible=true;sun.color.set(0xfff4e0);sun.intensity=.5;renderer.shadowMap.needsUpdate=true;sun.target.position.set(P.x,0,P.z);sun.position.set(P.x+30,70,P.z+22);rainM.visible=snowM.visible=false}
 else{sun.visible=true;updatePrecip(dt,pv,WXT[WX]);if(QT[qi].thr)renderer.shadowMap.needsUpdate=(shTick++&1)==0;applyTime();
  const SN=220/2048*8,fx2=Math.round((P.x+Math.sin(h)*30)/SN)*SN,fz2=Math.round((P.z+Math.cos(h)*30)/SN)*SN;sun.target.position.set(fx2,0,fz2);sun.position.set(fx2+sunDir.x*160,sunDir.y*160,fz2+sunDir.z*160)}
 updateCamera(dt);viewOffset();
 if(GSTATE==='play'){updateHud(dt);if((fc++&3)===0)drawMap()}
 renderer.render(scene,cam)}
applyAll();respawn();cars.forEach(c=>place(c,P.x,P.z));openMenu(false);requestAnimationFrame(frame);
